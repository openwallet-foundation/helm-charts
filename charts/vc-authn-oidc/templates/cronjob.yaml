{{- if .Values.cleanup.cronjob.enabled }}
{{- if le (int .Values.cleanup.cronjob.timeoutSeconds) (int .Values.controller.cleanup.maxDurationSeconds) }}
{{- fail "cleanup.cronjob.timeoutSeconds must be greater than controller.cleanup.maxDurationSeconds" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "global.fullname" . }}-cleanup
  labels:
    {{- include "vc-authn-oidc.cleanup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cleanup.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cleanup.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # Retries are handled in the script; pod restarts would re-trigger cleanup runs
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "vc-authn-oidc.cleanup.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          containers:
          - name: cleanup
            image: curlimages/curl:8.5.0
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting cleanup job at $(date)"

              # Retry only when the request did not reach the controller (e.g. during a rollout);
              # a timed-out run keeps going server-side, so it is never retried.
              for i in 1 2 3; do
                echo "Cleanup attempt $i/3"

                http_code=$(curl -s -w "%{http_code}" -o /tmp/response.json \
                  --max-time {{ .Values.cleanup.cronjob.timeoutSeconds }} \
                  -H "Content-Type: application/json" \
                  -H "X-API-Key: $CLEANUP_API_KEY" \
                  -X DELETE \
                  "http://{{ include "global.fullname" . }}:{{ .Values.service.port }}/cleanup")
                curl_exit=$?

                echo "HTTP Status: $http_code (curl exit code $curl_exit)"
                cat /tmp/response.json 2>/dev/null; echo

                case "$http_code" in
                  200)
                    echo "Cleanup completed successfully at $(date)"
                    exit 0
                    ;;
                  409)
                    echo "Cleanup already in progress, nothing to do"
                    exit 0
                    ;;
                  401|403)
                    echo "Authentication failed - check API key configuration"
                    exit 1
                    ;;
                esac

                if [ "$curl_exit" = "28" ]; then
                  echo "Request timed out; the controller finishes the run within its time budget"
                  exit 1
                fi

                if [ "$http_code" != "000" ]; then
                  echo "Cleanup failed with HTTP $http_code"
                  exit 1
                fi

                if [ $i -lt 3 ]; then
                  echo "Controller unreachable, retrying in {{ .Values.cleanup.cronjob.retryDelaySeconds }} seconds..."
                  sleep {{ .Values.cleanup.cronjob.retryDelaySeconds }}
                fi
              done

              echo "All cleanup attempts failed"
              echo "Cleanup job failed at $(date)"
              exit 1
            env:
            - name: CLEANUP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vc-authn-oidc.apiSecretName" . }}
                  key: controllerApiKey
            resources:
              {{- toYaml .Values.cleanup.cronjob.resources | nindent 14 }}
          {{- with .Values.cleanup.cronjob.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cleanup.cronjob.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
